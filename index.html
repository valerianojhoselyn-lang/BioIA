<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2e7d32"><link rel="manifest" href="manifest.json"><title>BioIA</title><style>body{margin:0;font-family:Arial,sans-serif;background:#eef7ef;color:#17351d}.wrap{max-width:900px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#14532d,#43a047);color:white;padding:28px;border-radius:20px;text-align:center}.card{background:white;padding:20px;border-radius:16px;margin-top:18px;box-shadow:0 4px 18px #0001}h1{margin:0;font-size:34px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:bold;display:block;margin-bottom:5px}input,select,button{width:100%;padding:12px;border-radius:9px;border:1px solid #ccd5cc;box-sizing:border-box;font-size:15px}button{background:#2e7d32;color:white;border:0;font-weight:bold;margin-top:15px}.result{text-align:center;background:#e3f2fd}.pred{font-size:32px;font-weight:bold;color:#1565c0}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:center}th{background:#2e7d32;color:#fff}.scroll{overflow:auto}.rank{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.plant{padding:15px;background:#f5faf5;border-radius:12px}.muted{color:#607d68}@media(max-width:650px){.grid,.rank{grid-template-columns:1fr}h1{font-size:27px}}</style></head><body><div class="wrap"><header class="hero"><div style="font-size:50px">🌱⚡🤖</div><h1>BioIA</h1><p>Predicción Biofotovoltaica + Inteligencia Artificial</p><small>Proyecto de Ciencia · 1.º de Secundaria</small></header><section class="card"><h2>🔬 Registrar planta</h2><div class="grid"><div><label>Planta</label><select id="p"><option>P1</option><option>P2</option><option>P3</option><option>P4</option><option>P5</option><option>P6</option></select></div><div><label>🍃 Hojas</label><input id="h" type="number" min="0" placeholder="18"></div><div><label>💧 Humedad (%)</label><input id="m" type="number" min="0" max="100" placeholder="65"></div><div><label>☀️ Iluminación (lux)</label><input id="l" type="number" min="0" placeholder="700"></div><div><label>🌿 Estado</label><select id="e"><option value="sana">Sana</option><option value="florecida">Con flores</option><option value="debil">Débil</option><option value="sinhojas">Pocas hojas</option></select></div><div><label>⚡ Voltaje real (V)</label><input id="r" type="number" step="0.01" placeholder="0.38"></div></div><button onclick="analizar()">🤖 Analizar con BioIA</button></section><section id="res" class="card result" style="display:none"><h2>Resultado</h2><p>Rango predictivo</p><div id="pred" class="pred"></div><p id="cmp"></p></section><section class="card"><h2>📊 Historial</h2><div class="scroll"><table><thead><tr><th>Planta</th><th>Hojas</th><th>Humedad</th><th>Luz</th><th>Predicción</th><th>Real</th><th>Resultado</th></tr></thead><tbody id="tab"></tbody></table></div><button onclick="borrar()">🗑️ Borrar historial</button></section><section class="card"><h2>🏆 Ranking</h2><div id="rank" class="rank"><p class="muted">Registra plantas para ver el ranking.</p></div></section></div><script>const K='bioia';let data=JSON.parse(localStorage.getItem(K)||'[]');function model(h,m,l,e){let a=.30,b=.35;if(h>=30){a+=.04;b+=.05}else if(h>=15){a+=.02;b+=.03}if(m>=60&&m<=80){a+=.04;b+=.05}else if(m>80){a+=.01;b+=.02}else if(m<40){a-=.04;b-=.03}if(l>=700){a+=.03;b+=.04}else if(l>=400){a+=.01;b+=.02}else if(l<200){a-=.02;b-=.01}if(e==='florecida'){a+=.02;b+=.03}if(e==='debil'){a-=.04;b-=.03}if(e==='sinhojas'){a-=.03;b-=.02}return [Math.max(.05,a),Math.max(a+.01,b)]}function analizar(){let p=document.getElementById('p').value,h=+document.getElementById('h').value,m=+document.getElementById('m').value,l=+document.getElementById('l').value,e=document.getElementById('e').value,r=document.getElementById('r').value;if([h,m,l].some(Number.isNaN)){alert('Completa hojas, humedad e iluminación.');return}let [a,b]=model(h,m,l,e),real=r===''?null:+r,ok=real!==null&&real>=a&&real<=b;data=data.filter(x=>x.p!==p);data.push({p,h,m,l,a,b,real,ok});localStorage.setItem(K,JSON.stringify(data));document.getElementById('res').style.display='block';document.getElementById('pred').textContent=a.toFixed(2)+' – '+b.toFixed(2)+' V';document.getElementById('cmp').textContent=real===null?'Sin medición real.':ok?'🟢 La medición está dentro del rango predicho.':'🔵 La medición está fuera del rango predicho; analicen posibles factores experimentales.';render()}function render(){document.getElementById('tab').innerHTML=data.map(x=>`<tr><td>${x.p}</td><td>${x.h}</td><td>${x.m}%</td><td>${x.l}</td><td>${x.a.toFixed(2)}–${x.b.toFixed(2)} V</td><td>${x.real===null?'—':x.real.toFixed(2)+' V'}</td><td>${x.real===null?'Pendiente':x.ok?'🟢 Coincide':'🔵 Variación'}</td></tr>`).join('');let ranked=[...data].sort((x,y)=>(y.real??(y.a+y.b)/2)-(x.real??(x.a+x.b)/2));document.getElementById('rank').innerHTML=ranked.length?ranked.map((x,i)=>`<div class="plant"><b>${i+1}. ${x.p}</b><br>⚡ ${(x.real??(x.a+x.b)/2).toFixed(2)} V<br>💧 ${x.m}%<br>☀️ ${x.l} lux</div>`).join(''):'<p class="muted">Registra plantas para ver el ranking.</p>'}function borrar(){if(confirm('¿Borrar todos los datos?')){data=[];localStorage.removeItem(K);render()}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
